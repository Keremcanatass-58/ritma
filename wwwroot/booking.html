<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f37"><meta name="description" content="RITMA ile işletmenden kolayca randevu iste."><link rel="icon" type="image/svg+xml" href="/ritma-mark.svg">
<title>Randevu al · RITMA</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20332d;background:#f3f5f1;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 5%,#e2ebe4,transparent 42%),#f3f5f1}.wrap{width:min(760px,100% - 32px);margin:42px auto}.brand{font-size:13px;letter-spacing:.22em;font-weight:800;color:#255d4e}.card{margin-top:22px;padding:clamp(22px,5vw,42px);background:#fff;border:1px solid #e4e9e2;border-radius:22px;box-shadow:0 20px 70px #183b2a0c}.eyebrow{color:#947b4e;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.title{font:400 clamp(30px,6vw,46px)/1.06 Georgia,serif;letter-spacing:-.03em;margin:10px 0}.muted{color:#748079;line-height:1.6}.form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:24px}.field{display:grid;gap:7px;margin:8px 0}.field label{font-size:12px;font-weight:700;color:#48564e}.field input,.field select,.field textarea{width:100%;min-height:46px;padding:11px 12px;border:1px solid #dce4dc;border-radius:10px;background:#fcfdfb;color:#25362f;font:inherit;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#528b79;box-shadow:0 0 0 3px #528b7919}.field textarea{min-height:84px;resize:vertical}.wide{grid-column:1/-1}.slots{display:flex;flex-wrap:wrap;gap:8px}.slot{border:1px solid #dbe4dc;border-radius:9px;padding:9px 12px;background:#fff;color:#305648;font-weight:700}.slot[aria-pressed=true]{background:#1d5145;color:#fff;border-color:#1d5145}.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#1c5147;color:white;font:inherit;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.message{min-height:22px;margin-top:14px;color:#536259}.error{color:#a53732}.success{padding:17px;border-radius:12px;background:#edf5ef;color:#24583e;line-height:1.65}.success a{color:#24583e;word-break:break-all}.footer{text-align:center;color:#8a938d;font-size:12px;margin:20px}.hidden{display:none!important}@media(max-width:560px){.wrap{margin:24px auto}.form{grid-template-columns:1fr}.wide{grid-column:auto}.card{border-radius:17px}.title{font-size:34px}}
</style></head>
<body><main class="wrap"><div class="brand">RITMA</div><section class="card"><div class="eyebrow">Kolayca planla</div><h1 class="title" id="business-name">Randevunu oluştur</h1><p class="muted" id="intro">Uygun hizmeti ve saati seç, randevunu birkaç adımda tamamla.</p><div id="form-area" class="hidden"><form id="booking-form" class="form"><div class="field wide"><label for="service">Hizmet</label><select id="service" required><option value="">Hizmet seç</option></select></div><div class="field"><label for="date">Tarih</label><input id="date" type="date" required></div><div class="field"><label for="staff">Uzman (isteğe bağlı)</label><select id="staff"><option value="">Uygun olan ilk uzman</option></select></div><div class="field wide"><label>Saat</label><div id="slots" class="slots muted">Önce hizmet ve tarih seç.</div></div><div class="field"><label for="first">Ad</label><input id="first" autocomplete="given-name" required maxlength="80"></div><div class="field"><label for="last">Soyad</label><input id="last" autocomplete="family-name" required maxlength="80"></div><div class="field"><label for="phone">Telefon</label><input id="phone" type="tel" autocomplete="tel" required maxlength="32" placeholder="05xx xxx xx xx"></div><div class="field"><label for="email">E-posta (isteğe bağlı)</label><input id="email" type="email" autocomplete="email" maxlength="160"></div><div class="field wide"><label for="notes">İşletmeye not (isteğe bağlı)</label><textarea id="notes" maxlength="500" placeholder="Randevunla ilgili paylaşmak istediğin bir şey var mı?"></textarea></div><div class="wide"><button id="submit" class="btn" disabled>Randevuyu iste</button></div></form></div><div id="message" class="message" role="status" aria-live="polite"></div><div id="manage" class="hidden"></div></section><div class="footer">Randevu bilgilerin yalnızca bu işletmeyle paylaşılır.</div></main>
<script>
const q=new URLSearchParams(location.search),id=q.get('businessId'),$=s=>document.querySelector(s),api=async(path,opts={})=>{const r=await fetch('/api/public/booking/'+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Bir sorun oluştu. Lütfen tekrar dene.');return d};let selected=null,business=null;const msg=(text,error=false)=>{$('#message').textContent=text;$('#message').className='message'+(error?' error':'')};
async function loadSlots(){selected=null;$('#submit').disabled=true;const service=$('#service').value,date=$('#date').value;if(!service||!date){$('#slots').textContent='Önce hizmet ve tarih seç.';return}$('#slots').textContent='Uygun saatler aranıyor…';try{const p=new URLSearchParams({serviceId:service,date});if($('#staff').value)p.set('staffId',$('#staff').value);const slots=await api(`${id}/slots?${p}`);$('#slots').innerHTML=slots.length?slots.map((s,i)=>`<button type="button" class="slot" aria-pressed="false" data-i="${i}">${new Intl.DateTimeFormat('tr-TR',{hour:'2-digit',minute:'2-digit'}).format(new Date(s.startTime))}</button>`).join(''):'Bu gün için uygun saat kalmadı. Başka bir gün deneyebilirsin.';$('#slots').querySelectorAll('.slot').forEach((b,i)=>b.onclick=()=>{selected=slots[i];$('#slots').querySelectorAll('.slot').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');$('#submit').disabled=false})}catch(e){$('#slots').textContent=e.message}}
async function init(){if(!id){msg('Randevu bağlantısı eksik. İşletmeden güncel bağlantıyı iste.',true);return}try{business=await api(id);$('#business-name').textContent=business.Name||business.name;$('#intro').textContent=[business.address,business.phone].filter(Boolean).join(' · ')||'Hizmetini ve sana uygun zamanı seç.';for(const s of business.services||[])$('#service').insertAdjacentHTML('beforeend',`<option value="${s.id}">${s.name} · ${s.durationMinutes} dk · ${new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(s.price)}</option>`);for(const s of business.staff||[])$('#staff').insertAdjacentHTML('beforeend',`<option value="${s.id}">${s.firstName} ${s.lastName}</option>`);const today=new Date(),max=new Date();max.setDate(today.getDate()+60);$('#date').min=today.toLocaleDateString('en-CA');$('#date').max=max.toLocaleDateString('en-CA');$('#date').value=$('#date').min;$('#form-area').classList.remove('hidden');$('#service').onchange=loadSlots;$('#date').onchange=loadSlots;$('#staff').onchange=loadSlots;await loadSlots()}catch(e){msg(e.message,true)}
const token=new URLSearchParams(location.hash.slice(1)).get('manageToken')||q.get('manageToken')||sessionStorage.getItem('ritma-manage-token');if(token){sessionStorage.setItem('ritma-manage-token',token);$('#manage').classList.remove('hidden');$('#manage').innerHTML='<p class="muted">Randevunu iptal etmek istersen:</p><button class="btn" id="cancel">Randevuyu iptal et</button>';$('#cancel').onclick=async()=>{if(!confirm('Randevunu iptal etmek istediğine emin misin?'))return;try{await api(`${id}/cancel`,{method:'POST',body:JSON.stringify({manageToken:token})});sessionStorage.removeItem('ritma-manage-token');msg('Randevun iptal edildi.');$('#manage').innerHTML=''}catch(e){msg(e.message,true)}}}}
$('#booking-form').onsubmit=async e=>{e.preventDefault();if(!selected)return;const b=$('#submit');b.disabled=true;b.textContent='İşleniyor…';try{const result=await api(id,{method:'POST',body:JSON.stringify({serviceId:Number($('#service').value),staffId:selected.staffId,startTime:selected.startTime,firstName:$('#first').value.trim(),lastName:$('#last').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim()||null,notes:$('#notes').value.trim()||null})});sessionStorage.setItem('ritma-manage-token',result.manageToken);const manageUrl=new URL(location.href);manageUrl.hash=new URLSearchParams({manageToken:result.manageToken}).toString();$('#form-area').classList.add('hidden');$('#intro').textContent='Talebin işletmeye iletildi. İşletme randevunu onayladığında seninle iletişime geçebilir.';msg('Randevu talebin alındı.');$('#manage').classList.remove('hidden');$('#manage').innerHTML=`<div class="success"><strong>${result.businessName}</strong><br>${new Intl.DateTimeFormat('tr-TR',{dateStyle:'full',timeStyle:'short'}).format(new Date(result.startTime))}<br>İptal bağlantın: <a href="${manageUrl.href}">Randevu yönetim bağlantısını kaydet</a></div><button class="btn soft" id="download-ics">Takvime ekle</button><button class="btn" onclick="location.reload()">Başka randevu al</button>`;document.querySelector('#download-ics').onclick=()=>{const fmt=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const escapeIcs=s=>String(s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\r?\n/g,'\\n');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RITMA//Randevu//TR','BEGIN:VEVENT',`UID:ritma-${result.appointmentId}@ritma.local`,`DTSTAMP:${fmt(new Date())}`,`DTSTART:${fmt(result.startTime)}`,`DTEND:${fmt(result.endTime)}`,`SUMMARY:${escapeIcs(result.businessName+' randevusu')}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='ritma-randevu.ics';a.click();URL.revokeObjectURL(a.href)} }catch(e){msg(e.message,true);b.disabled=false;b.textContent='Randevuyu iste';await loadSlots()}};init();
</script></body></html>
